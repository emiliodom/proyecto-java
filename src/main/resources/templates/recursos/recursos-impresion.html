<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recursos educativos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/app.css}" />
  </head>

  <body>
  <header class="bg-light shadow-sm mb-4">
    <div class="container py-3">
        <div class="d-flex flex-wrap gap-3 justify-content-between align-items-center">
        <h1 class="h3 m-0">Recursos educativos</h1>
        </div>
    </div>
    </header>
    <main class="container">
      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
            <div class="fw-semibold">Registros</div>
            <div class="text-muted
                small" th:text="'Total: ' + ${#lists.size(resources)}">Total: 0</div>
            </div>
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                    <tr>
                        <th style="width: 90px">ID</th>
                        <th>Título</th>
                        <th style="width: 160px">Subtítulo</th>
                        <th style="width: 160px">Tipo</th>                
                        <th>Enlace</th>
                        <th style="width: 140px">Estado</th>
                        <th style="width: 140px">Docente</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(resources)}">
                        <td colspan="8" class="text-muted">Aún no hay recursos. Crea el primero.</td>
                    </tr>
                    <tr th:each="recurso : ${resources}">
                        <td th:text="${recurso.id}">1</td>
                        <td th:text="${recurso.titulo}">Título del recurso</td>
                        <td th:text="${recurso.subtitulo}">Subtítulo del recurso</td>
                        <td th:text="${recurso.tipo}">Tipo del recurso</td>
                        <td><a th:href="${recurso.url}" target="_blank" th:text="${recurso.url}">Enlace del recurso</a></td>
                        <td th:text="${recurso.disponible}">Estado del recurso</td>
                        <td th:text="${recurso.nombreDocente}">Docente responsable</td>
                    </tr>
                    </tbody>
                </table>    
            </div>
        </div>
        </div>
    </main>
    <script src="/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
